# LOCAL development/test stack only. Never `supabase config push` this file to Staging/Production
# without reviewing every auth setting against docs/DEPLOYMENT_AND_TESTS.md.
# Dedicated project_id and 554xx ports: this stack must never share containers/ports with other projects.
project_id = "fortune-journal-local"

[api]
enabled = true
port = 55421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
# Asymmetric (ES256) signing keys; generate locally with
#   supabase gen signing-key --algorithm ES256 > supabase/signing_keys.json   (gitignored)
# signing_keys_path = "./signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
# Google is the only end-user sign-in method. Email/password signup stays off.
enable_signup = false

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = false
# Configure Google credentials through local secrets/dashboard before OAuth E2E.
# This local config deliberately does not enable a fallback password login.

[auth.oauth_server]
# Supabase OAuth 2.1 server for MCP clients (separate from Google login).
enabled = true
authorization_url_path = "/oauth/consent"
# Local testing registers clients dynamically. Staging decision is documented in docs/DEPLOYMENT_AND_TESTS.md.
allow_dynamic_registration = true
